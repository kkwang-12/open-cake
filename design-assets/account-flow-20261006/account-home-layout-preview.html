<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body {
  --color-bg: #FAFAF8;
  --color-surface: #FFFFFF;
  --color-text: #111111;
  --color-body: #666666;
  --color-muted: #8A8A8A;
  --color-accent: #B5684C;
  --color-line: #E5E2DD;
  --tab-bar-inset: 24px;
  --tab-bar-height: 58px;
  --tab-bar-bottom-gap: 7px;
  --tab-bar-occupied-height: calc(var(--tab-bar-height) + var(--tab-bar-bottom-gap) + env(safe-area-inset-bottom));
  --tab-page-bottom-padding: calc(var(--tab-bar-occupied-height) + 12px);
  background: var(--color-bg);
  color: var(--color-text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 3.7333333333333334vw;
  line-height: 1.6;
}

div, span, input, textarea, button { box-sizing: border-box; }
.tab-content { opacity: 1; transform: translateY(0); }
.tab-content.tab-prepared { opacity: 0; transform: translateY(8px); }
.tab-content.tab-leaving { opacity: 0; transition: opacity 90ms ease-out, transform 90ms ease-out; }
.tab-content.tab-entering { opacity: 1; transform: translateY(0); transition: opacity 220ms ease-out, transform 220ms ease-out; }
button { margin: 0; padding: 0; color: inherit; font: inherit; line-height: inherit; background: transparent; }
button::after { border: 0; }
.page { padding: 4.266666666666667vw 4.266666666666667vw calc(6.4vw + env(safe-area-inset-bottom)); }
.eyebrow { display: block; color: var(--color-body); font-size: 2.933333333333333vw; letter-spacing: 0.26666666666666666vw; }
.title { font-size: 4.266666666666667vw; font-weight: 650; line-height: 1.4; margin: 2.1333333333333333vw 0; }
.display-title { font-size: 4.266666666666667vw; font-weight: 700; line-height: 1.4; margin: 3.2vw 0; }
.subtitle, .muted { color: var(--color-body); font-size: 3.2vw; }
.section { margin-top: 6.4vw; }
.section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 2.1333333333333333vw; margin-bottom: 3.2vw; }
.section-title { font-size: 4.266666666666667vw; font-weight: 600; }
.primary-action, .secondary-action { min-height: 44px; padding: 3.2vw 4.266666666666667vw; font-size: 3.7333333333333334vw; border-radius: 133.2vw; text-align: center; }
.primary-action.primary-action { display: block; width: 100% !important; color: #FFFFFF; background: #111111; }
.secondary-action { color: #111111; border: 0.13333333333333333vw solid #D5D2CD; }
.primary-action[disabled], .secondary-action[disabled] { opacity: .4; }
.primary-action[disabled] { color: #FFFFFF !important; background: #111111 !important; }
.action-row { display: flex; gap: 2.1333333333333333vw; flex-wrap: wrap; margin-top: 4.266666666666667vw; }
.action-row button { flex: 1; width: auto !important; min-width: 32vw; }
.status-note { padding: 3.2vw 0; border-bottom: 0.13333333333333333vw solid var(--color-line); color: var(--color-body); font-size: 2.933333333333333vw; }
.error-note { padding: 3.2vw; margin: 3.2vw 0; border: 0.13333333333333333vw solid var(--color-line); border-radius: 3.2vw; font-size: 3.2vw; overflow-wrap: break-word; }
.error-reference { display: block; margin-top: 1.0666666666666667vw; color: var(--color-body); font-size: 2.933333333333333vw; }
.product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4.266666666666667vw 3.2vw; }
.pressed { opacity: .65; }
.list-row { width: 100% !important; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 3.2vw; padding: 3.2vw 0; border-bottom: 0.13333333333333333vw solid var(--color-line); text-align: left; }
.list-row span { overflow-wrap: break-word; }
.footnote { display: block; margin-top: 6.4vw; font-size: 2.933333333333333vw; color: var(--color-body); }

.account-page { padding: 1.6vw 3.466666666666667vw var(--tab-page-bottom-padding); }
/* Geometry follows the selected 240px-wide screen inside the reference phone. */
.account-profile { display: flex; align-items: flex-start; gap: 3.2vw; min-height: 29.866666666666667vw; margin: 0 1.8666666666666667vw; }
.account-avatar { display: block; width: 26.666666666666668vw; height: 26.666666666666668vw; flex: 0 0 26.666666666666668vw; border-radius: 50%; }
.account-profile-copy { flex: 1; min-width: 0; padding-top: 3.2vw; }
.account-greeting { display: block; font-size: 5.333333333333333vw; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; }
.account-subtitle { display: block; margin-top: 2.1333333333333333vw; color: #888888; font-size: 3.466666666666667vw; font-weight: 400; line-height: 1.4; }
.account-login { display: flex; align-items: center; justify-content: flex-start; width: 35.2vw !important; min-height: 44px; margin: 1.3333333333333333vw 0 0 !important; padding: 0; text-align: left; }
.account-login-pill { display: flex; align-items: center; justify-content: center; width: 35.2vw; min-height: 10.666666666666666vw; padding: 1.3333333333333333vw 2.6666666666666665vw; border-radius: 999px; background: #111111; color: #FFFFFF; font-size: 3.466666666666667vw; font-weight: 500; line-height: 1.4; }
.account-stats { display: flex; margin-top: 5.333333333333333vw; overflow: hidden; border-radius: 3.7333333333333334vw; background: #FFFFFF; }
.account-stat { position: relative; display: flex; flex: 1 1 0; flex-direction: column; align-items: center; justify-content: center; gap: 1.0666666666666667vw; width: auto !important; min-width: 0; min-height: 21.866666666666667vw; margin: 0 !important; padding: 2.6666666666666665vw 1.0666666666666667vw; border-radius: 0; }
.account-stat + .account-stat::before { position: absolute; left: 0; top: 50%; width: 1px; height: 11.2vw; background: #F0EEEB; transform: translateY(-50%); content: ''; }
.account-stat-value { color: #111111; font-size: 5.333333333333333vw; font-weight: 500; line-height: 1.25; }
.account-stat-label { color: #666666; font-size: 3.2vw; font-weight: 400; line-height: 1.4; text-align: center; }
.account-birthday-card { margin-top: 3.7333333333333334vw; overflow: hidden; border-radius: 3.2vw; background: #FFF9F3; }
.account-birthday { position: relative; display: flex; align-items: center; width: 100% !important; min-height: 38.4vw; margin: 0 !important; padding: 4.266666666666667vw 4.8vw; overflow: hidden; border-radius: 0; background: #F2E8DD; text-align: left; }
.account-birthday-image { position: absolute; top: 0; right: 0; width: 76%; height: 100%; }
.account-birthday-shade { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, #F2E8DD 0%, #F2E8DD 24%, rgba(242, 232, 221, .72) 36%, rgba(242, 232, 221, 0) 52%); pointer-events: none; }
.account-birthday-copy { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; width: 62%; }
.account-birthday-description { display: block; color: #666666; font-size: 3.7333333333333334vw; font-weight: 400; line-height: 1.4; }
.account-birthday-description span { display: block; }
.account-birthday-action { display: flex; align-items: center; justify-content: center; gap: 1.6vw; width: 28.8vw; min-height: 8.533333333333333vw; margin-top: 3.2vw; padding: 1.0666666666666667vw 2.1333333333333333vw; border-radius: 999px; background: #111111; color: #FFFFFF; font-size: 3.466666666666667vw; font-weight: 500; line-height: 1.4; }
.account-birthday-services { display: flex; align-items: center; min-height: 9.066666666666666vw; padding: 1.6vw 2.6666666666666665vw; border-top: 1px solid #F0E8DF; }
.account-birthday-service { display: flex; flex: 1; align-items: center; justify-content: center; gap: 1.0666666666666667vw; min-width: 0; color: #666666; font-size: 3.2vw; font-weight: 400; line-height: 1.4; white-space: nowrap; }
.account-birthday-service + .account-birthday-service { border-left: 1px solid #DED8D1; }
.account-birthday-service:last-child { flex: 1.4; }
.account-birthday-service img { width: 3.7333333333333334vw; height: 3.7333333333333334vw; flex: 0 0 3.7333333333333334vw; }
.account-menu { margin-top: 3.7333333333333334vw; padding: 0 5.333333333333333vw; overflow: hidden; border-radius: 3.7333333333333334vw; background: #FFFFFF; }
.account-menu-row { display: flex; align-items: center; gap: 4.8vw; width: 100% !important; min-height: 12vw; margin: 0 !important; padding: 2.6666666666666665vw 0; border-radius: 0; border-bottom: 1px solid #F0EEEB; text-align: left; }
.account-menu-row:last-child { border-bottom: 0; }
.account-menu-icon { display: block; width: 5.333333333333333vw; height: 5.333333333333333vw; flex: 0 0 5.333333333333333vw; }
.account-menu-label { flex: 1; min-width: 0; color: #111111; font-size: 4.266666666666667vw; font-weight: 400; line-height: 1.4; overflow-wrap: break-word; }
.account-menu-arrow { width: 3.7333333333333334vw; height: 3.7333333333333334vw; flex: 0 0 3.7333333333333334vw; opacity: .42; transform: rotate(180deg); }
.account-pressed { opacity: .65; }

.tab-bar { position: fixed; left: var(--tab-bar-inset, 24px); right: var(--tab-bar-inset, 24px); bottom: 7px; bottom: calc(var(--tab-bar-bottom-gap, 7px) + env(safe-area-inset-bottom)); z-index: 20; display: flex; align-items: center; height: var(--tab-bar-height, 58px); padding: 0; border: 0; border-radius: 29px; background: #111111; box-shadow: none; box-sizing: border-box; }
.tab-item { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: auto !important; min-width: 0; min-height: var(--tab-bar-height, 58px); height: var(--tab-bar-height, 58px); margin: 0 !important; padding: 0; border: 0; border-radius: 29px; color: rgba(255,255,255,.68); background: transparent; line-height: 1; }
.tab-item::after { border: 0; }
.tab-icon { display: block; width: 21px; height: 21px; flex-shrink: 0; opacity: .68; }
.selected .tab-icon { opacity: 1; }
.tab-label { font-size: 12px; line-height: 16px; font-weight: 400; }
.selected .tab-label { font-weight: 500; }
.tab-item.selected { color: #FFFFFF; }
